# ---------------------------------------------------------
# PENGATURAN UMUM (GENERAL)
# ---------------------------------------------------------
general:
  # Pilih bahasa: 'en' (Inggris) atau 'id' (Indonesia)
  # File bahasa ada di folder plugins/ReviveMe/lang/
  language: 'en'

  # Jumlah nyawa default saat pemain pertama kali bergabung
  default-lives: 2

# ---------------------------------------------------------
# PENGATURAN RITUAL (RITUAL)
# ---------------------------------------------------------
ritual:
  # Durasi ritual kebangkitan (dalam detik)
  duration-seconds: 10

  # Apakah reviver (pemain yang membangkitkan) harus kehilangan 1 nyawa?
  sacrifice-enabled: true

  # Apakah ritual gagal jika reviver bergerak?
  fail-on-move: true

  # Apakah ritual gagal jika reviver menerima damage?
  fail-on-damage: true

  # Cooldown antar ritual per pemain (dalam detik)
  cooldown-seconds: 60

# ---------------------------------------------------------
# PENGATURAN EKONOMI (ECONOMY)
# ---------------------------------------------------------
economy:
  # Apakah fitur ekonomi (Vault) diaktifkan?
  enabled: true

  # Biaya yang harus dibayar pemain untuk melakukan ritual
  # Set ke 0 jika server tidak menggunakan ekonomi
  ritual-cost: 5000
  # Penalti Soul Coin saat mati (dalam persen)
  death-penalty-percent: 10

# ---------------------------------------------------------
# PENGATURAN DIMENSI KEMATIAN (DEATH DIMENSION)
# ---------------------------------------------------------
death-dimension:
  enabled: true
  world-name: "death_realm"
  time: 18000
  disable-weather: true
  # Waktu tunggu maksimal di Alam Baka (dalam detik)
  # 240 detik = 4 menit
  max-ghost-time: 240
# ---------------------------------------------------------
# PENGATURAN VISUAL (VISUAL EFFECTS)
# ---------------------------------------------------------
visuals:
  # Efek partikel di sekitar pemain hantu (Alam Baka)
  ghost-aura-enabled: true

  # Jenis partikel (CLOUD, END_ROD, SOUL, dll)
  # Pisahkan dengan koma jika ingin lebih dari satu
  ghost-particles: "CLOUD, END_ROD"
  # ---------------------------------------------------------
  # PENGATURAN TOKO (SHOP)
  # ---------------------------------------------------------
