# ---------------------------------------------------------
# EVENT BOSS (RITUAL BOSS)
# ---------------------------------------------------------
boss-event:
  # Aktifkan fitur ini?
  enabled: true
  # Interval spawn boss (dalam jam)
  interval-hours: 3
  # Nama Boss (bisa diganti)
  boss-name: "<dark_red>Ancient Soul Devourer</dark_red>"
  # Hadiah uang untuk setiap pemain yang ikut membunuh
  reward-money: 10000
# ---------------------------------------------------------
# INTEGRASI DISCORD (WEBHOOK)
# ---------------------------------------------------------
discord:
  # Aktifkan fitur ini?
  enabled: false
  # Masukkan URL Webhook Discord kamu di sini
  # (Server Settings > Integrations > Webhooks > Copy Webhook URL)
  webhook-url: "https://discord.com/api/webhooks/123456789/abcdefg"
  # Kirim pesan saat ada yang berhasil di-revive?
  notify-revive: true
  # Kirim pesan saat Boss Event muncul?
  notify-boss: true

# ---------------------------------------------------------
# SOUL CURRENCY (MATA UANG JIWA)
# ---------------------------------------------------------
soul-currency:
  # Berapa Soul Coin yang didapat saat berhasil membangkitkan pemain?
  reward-per-revive: 5
  # Berapa Soul Coin yang didapat saat membunuh Soul Boss?
  reward-per-boss: 50
# ---------------------------------------------------------
# DATABASE SETTINGS (SQLite / MySQL)
# ---------------------------------------------------------
database:
  # Pilih 'sqlite' atau 'mysql'
  type: "sqlite"
  mysql:
    host: "localhost"
    port: 3306
    database: "reviveme"
    username: "root"
    password: ""
