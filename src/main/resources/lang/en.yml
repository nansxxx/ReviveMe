    lore3: "<yellow>Use at a Soul Altar to revive.</yellow>"

  soul_head:
    name: "<dark_purple>Soul Head</dark_purple>"
    lore1: "<gray>Bound to: <white><player></white></gray>"
    lore2: "<yellow>Hold this near an Altar to revive them.</yellow>"

  soul_altar:
    name: "<gold>Soul Altar</gold>"
    lore1: "<gray>An ancient monolith of souls.</gray>"
    lore2: "<yellow>Place it on the ground to activate.</yellow>"

  revive_wand:
    name: "<light_purple>Revive Wand</light_purple>"
    lore1: "<dark_gray>---------------------</dark_gray>"
    lore2: "<gray>A wand imbued with ancient magic.</gray>"
    lore3: "<red>Single use. Right-click a ghost.</red>"

  soul_armor:
    name: "<dark_purple>Soul Armor</dark_purple>"
    lore1: "<gray>Crafted from pure souls.</gray>"
    lore2: "<yellow>Grants extra protection in the Death Realm.</yellow>"

  soul_trap:
    name: "<dark_red>Soul Trap</dark_red>"
    lore1: "<dark_gray>---------------------</dark_gray>"
    lore2: "<gray>An ancient soul-devouring trap.</gray>"
    lore3: "<red>Steals 1 life from players who die nearby.</red>"

  soul_bound_book:
    name: "<light_purple>Soul Bound Book</light_purple>"
    lore1: "<dark_gray>---------------------</dark_gray>"
    lore2: "<gray>Combine with an item in an Anvil.</gray>"
    lore3: "<yellow>Prevents the item from dropping on death.</yellow>"

  soul_leggings:
    name: "<dark_purple>Soul Leggings</dark_purple>"
    lore1: "<gray>Forged from the essence of lost souls.</gray>"
    lore2: "<yellow>Grants protection in the Death Realm.</yellow>"

  soul_boots:
    name: "<dark_purple>Soul Boots</dark_purple>"
    lore1: "<gray>Forged from the essence of lost souls.</gray>"
    lore2: "<yellow>Grants protection in the Death Realm.</yellow>"

  soul_pickaxe:
    name: "<dark_purple>Soul Pickaxe</dark_purple>"
    lore1: "<gray>Can mine a 3x3 area.</gray>"
    lore2: "<yellow>Perfect for clearing large areas.</yellow>"

  soul_sword:
    name: "<dark_purple>Soul Sword</dark_purple>"
    lore1: "<gray>A blade that hungers for souls.</gray>"
    lore2: "<yellow>Deals bonus damage to the undead.</yellow>"
